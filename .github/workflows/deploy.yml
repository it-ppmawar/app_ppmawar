name: Deploy Next.js to cPanel

on:
  workflow_dispatch:  # Deploy manual via GitHub Actions UI
  push:
    branches:
      - main
    paths:            # Deploy jika file penting berubah
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'next.config.ts'
      - 'server.js'
      - '.github/workflows/**'

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Next.js
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Prepare Production Files
        run: |
          mkdir -p deploy_dist/tmp
          echo "$(date)" > deploy_dist/tmp/restart.txt
          rm -rf .next/cache
          cp -r .next deploy_dist/
          cp -r public deploy_dist/
          cp package.json deploy_dist/
          cp package-lock.json deploy_dist/
          cp next.config.ts deploy_dist/
          cp server.js deploy_dist/
          echo "Commit: ${{ github.sha }}" > deploy_dist/public/version.txt
          echo "Date: $(date)" >> deploy_dist/public/version.txt
          echo "Branch: ${{ github.ref_name }}" >> deploy_dist/public/version.txt
          echo ""
          echo "=== Files prepared for deployment ==="
          ls -la deploy_dist/
          echo "=== Model files in public/models ==="
          ls -la deploy_dist/public/models/ || echo "(no models dir)"
          echo "=== Target Dir: ${{ secrets.FTP_TARGET_DIR }} ==="

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}
          dangerous-clean-slate: false
          log-level: minimal
          protocol: ftp
          security: loose
          timeout: 1800000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
