name: Deploy Next.js to cPanel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'
      - 'next.config.ts'
      - 'server.js'
      - '.github/workflows/**'

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-
            nextjs-

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Next.js
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Prepare Deploy Files
        run: node scripts/prepare-deploy-files.js

      - name: Create ZIP Bundle
        run: |
          mkdir -p upload_bundle/tmp
          cd deploy_dist
          zip -q -r -y ../upload_bundle/deploy.zip .
          cd ..
          cp public/unzip.php upload_bundle/unzip.php || true
          date > upload_bundle/tmp/restart.txt
          echo ZIP bundle created
          ls -lh upload_bundle/

      - name: Fast FTP Upload
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: node scripts/upload-ftp.js

      - name: Trigger Instant Server Extraction and Restart
        run: |
          echo Triggering PHP ZipArchive extraction on server...
          RESPONSE=$(curl -s -k --retry 3 --retry-delay 3 -m 60 https://app.ppmawar.or.id/unzip.php?key=ppmawar_deploy_2026 || true)
          echo $RESPONSE
          echo Server extraction webhook executed!

      - name: Deploy Status
        run: |
          echo Deploy bundle berhasil diupload dan diekstrak instan di server!
          echo Phusion Passenger me-restart server.js secara otomatis.
          echo Deployment selesai!
