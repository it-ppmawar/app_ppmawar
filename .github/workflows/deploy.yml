name: Deploy Next.js to cPanel

on:
  workflow_dispatch:  # Deploy manual via GitHub Actions UI
  push:
    branches:
      - main
    paths:            # Deploy jika file penting berubah
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'next.config.ts'
      - 'server.js'
      - '.github/workflows/**'

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Next.js
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Prepare Production ZIP Bundle
        run: |
          mkdir -p deploy_dist/tmp
          echo "$(date)" > deploy_dist/tmp/restart.txt
          cp -r .next deploy_dist/
          cp -r public deploy_dist/
          rm -rf deploy_dist/.next/cache
          rm -rf deploy_dist/.next/standalone
          rm -rf deploy_dist/.next/diagnostics
          rm -rf deploy_dist/.next/dev
          rm -rf deploy_dist/public/models
          cp .htaccess deploy_dist/ || true
          cp package.json deploy_dist/
          cp package-lock.json deploy_dist/
          cp next.config.ts deploy_dist/
          cp server.js deploy_dist/
          echo "Commit: ${{ github.sha }}" > deploy_dist/public/version.txt
          echo "Date: $(date)" >> deploy_dist/public/version.txt
          echo "Branch: ${{ github.ref_name }}" >> deploy_dist/public/version.txt

          # Create upload_bundle containing deploy.zip and unzip.php
          mkdir -p upload_bundle
          cd deploy_dist
          zip -q -r ../upload_bundle/deploy.zip .
          cd ..
          cp public/unzip.php upload_bundle/unzip.php || true
          
          echo "=== ZIP Bundle Prepared ==="
          ls -lh upload_bundle/

      - name: Upload ZIP Bundle to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./upload_bundle/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}
          dangerous-clean-slate: false
          log-level: minimal
          protocol: ftp
          security: loose
          timeout: 600000

      - name: Trigger Remote Unzip on cPanel
        run: |
          echo "⚡ Triggering remote unzip script..."
          RESPONSE=$(curl -s -k "https://app.ppmawar.or.id/unzip.php?key=ppmawar_deploy_2026")
          echo "$RESPONSE"
          if [[ "$RESPONSE" == *"404"* ]] || [[ "$RESPONSE" == *"403"* ]]; then
            echo "Retrying via /public/unzip.php..."
            curl -s -k "https://app.ppmawar.or.id/public/unzip.php?key=ppmawar_deploy_2026"
          fi
          echo ""
          echo "✅ Deployment triggered successfully!"



