name: Deploy Next.js to cPanel

on:
  workflow_dispatch:  # Deploy manual via GitHub Actions UI
  push:
    branches:
      - main
    paths:            # Deploy jika file penting berubah
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'next.config.ts'
      - 'server.js'
      - '.github/workflows/**'

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Next.js
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Prepare Production Files
        run: |
          mkdir -p deploy_dist/tmp
          echo "$(date)" > deploy_dist/tmp/restart.txt
          rm -rf .next/cache
          cp -r .next deploy_dist/
          cp -r public deploy_dist/
          cp package.json deploy_dist/
          cp package-lock.json deploy_dist/
          cp next.config.ts deploy_dist/
          cp server.js deploy_dist/
          echo "Commit: ${{ github.sha }}" > deploy_dist/public/version.txt
          echo "Date: $(date)" >> deploy_dist/public/version.txt
          echo "Branch: ${{ github.ref_name }}" >> deploy_dist/public/version.txt
          echo ""
          echo "=== Files prepared for deployment ==="
          ls -la deploy_dist/
          echo "=== Model files in public/models ==="
          ls -la deploy_dist/public/models/ || echo "(no models dir)"
          echo "=== Target Dir: ${{ secrets.FTP_TARGET_DIR }} ==="

      - name: Deploy to cPanel via FTP (lftp with retry)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: |
          sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 120;
            set net:max-retries 5;
            set net:reconnect-interval-base 30;
            set net:reconnect-interval-multiplier 1;
            set mirror:parallel-transfer-count 4;
            open -u '$FTP_USERNAME','$FTP_PASSWORD' ftp://$FTP_SERVER;
            mirror --reverse --delete --exclude-glob '.git*' --exclude-glob 'node_modules/' --verbose ./deploy_dist/ $FTP_TARGET_DIR;
            bye
          "
