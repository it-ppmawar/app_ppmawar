name: Deploy Next.js to cPanel

on:
  workflow_dispatch:  # Deploy manual via GitHub Actions UI
  push:
    branches:
      - main
    paths:            # Deploy jika file penting berubah
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'
      - 'next.config.ts'
      - 'server.js'
      - '.github/workflows/**'

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Next.js
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Prepare Deploy Files
        run: node scripts/prepare-deploy-files.js

      - name: Create ZIP Bundle & Restart Marker
        run: |
          sudo apt-get update -q -y && sudo apt-get install -q -y zip
          echo "=== Creating ZIP ==="
          mkdir -p upload_bundle/tmp
          cd deploy_dist
          zip -q -r -y ../upload_bundle/deploy.zip . || true
          cd ..
          date > upload_bundle/tmp/restart.txt
          echo "✅ ZIP bundle created at upload_bundle/deploy.zip"
          ls -lh upload_bundle/

      - name: Upload ZIP Bundle via Fast Node.js FTP & Trigger Restart
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: node scripts/upload-ftp.js

      - name: Deploy Status
        run: |
          echo "✅ Deploy bundle (ZIP + server.js) berhasil diupload dalam ~20 detik!"
          echo "🔄 Phusion Passenger me-restart server.js & AdmZip meng-ekstrak update secara instan."
          echo "🎉 Deployment selesai!"
