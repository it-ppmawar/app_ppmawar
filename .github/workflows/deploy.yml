name: Deploy Next.js to cPanel

on:
  workflow_dispatch:  # Deploy manual via GitHub Actions UI
  push:
    branches:
      - main
    paths:            # Deploy jika file penting berubah
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'
      - 'next.config.ts'
      - 'server.js'
      - '.github/workflows/**'

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Next.js
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Prepare Deploy Files
        run: node scripts/prepare-deploy-files.js

      # ── Upload file LANGSUNG dari deploy_dist/ (tanpa ZIP, lebih andal) ─────
      # Attempt 1: FTPS strict
      - name: Upload via FTPS – Attempt 1
        id: ftp1
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}
          dangerous-clean-slate: false
          log-level: minimal
          protocol: ftps
          security: strict
          timeout: 30000

      # Attempt 2: plain FTP loose
      - name: Upload via FTP – Attempt 2 (fallback loose)
        id: ftp2
        if: steps.ftp1.outcome != 'success'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}
          dangerous-clean-slate: false
          log-level: minimal
          protocol: ftp
          security: loose
          timeout: 30000

      # Attempt 3: Node.js basic-ftp dengan passive mode
      - name: Upload via Node.js basic-ftp – Attempt 3
        id: ftp3
        if: steps.ftp1.outcome != 'success' && steps.ftp2.outcome != 'success'
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
          FTP_LOCAL_DIR: './deploy_dist'
        run: node scripts/upload-ftp.js

      # ── Konfirmasi hasil deploy ────────────────────────────────────────────
      - name: Deploy Status
        run: |
          if [[ "${{ steps.ftp1.outcome }}" == "success" ]] || \
             [[ "${{ steps.ftp2.outcome }}" == "success" ]] || \
             [[ "${{ steps.ftp3.outcome }}" == "success" ]]; then
            echo "✅ FTP upload BERHASIL!"
            echo "🔄 Passenger akan restart otomatis via tmp/restart.txt"
            echo "🎉 Deployment selesai!"
          else
            echo "❌ Semua attempt FTP gagal!"
            exit 1
          fi
