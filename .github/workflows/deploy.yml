name: Deploy Next.js to cPanel

on:
  workflow_dispatch:  # Deploy manual via GitHub Actions UI
  push:
    branches:
      - main
    paths:            # Deploy jika file penting berubah
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'
      - 'next.config.ts'
      - 'server.js'
      - '.github/workflows/**'

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Next.js
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Prepare Deploy Files
        run: node scripts/prepare-deploy-files.js

      - name: Create ZIP Bundle
        run: |
          echo "=== Checking deploy_dist ==="
          ls -la deploy_dist/ | head -10
          echo "=== Creating ZIP ==="
          set +e
          cd deploy_dist
          zip -q -r -y ../upload_bundle/deploy.zip .
          ZIP_EXIT=$?
          cd ..
          set -e
          if [ "$ZIP_EXIT" -eq 0 ] || [ "$ZIP_EXIT" -eq 1 ]; then
            echo "✅ ZIP bundle created (exit code: $ZIP_EXIT)"
            ls -lh upload_bundle/
          else
            echo "❌ ZIP failed with exit code: $ZIP_EXIT"
            exit 1
          fi

      - name: Upload ZIP via Node.js FTP & Trigger App Restart
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: node scripts/upload-ftp.js

      - name: Deploy Status
        run: |
          echo "✅ Deploy bundle uploaded & app restart triggered successfully!"
          echo "🎉 Selesai!"
