name: Deploy Next.js to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to VPS (SSH Key)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        if: env.SSH_KEY != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Menjalankan deployment di VPS..."
            source ~/.bashrc 2>/dev/null || true
            source ~/.profile 2>/dev/null || true
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"
            cd ${{ secrets.VPS_TARGET_DIR }}
            echo "📂 Direktori aplikasi: $(pwd)"
            git pull origin main
            npm run build
            pm2 restart app-ppmawar || pm2 restart all
            echo "✅ Deployment ke VPS berhasil selesai!"

      - name: Deploy to VPS (Password)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        if: env.SSH_KEY == ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Menjalankan deployment di VPS..."
            source ~/.bashrc 2>/dev/null || true
            source ~/.profile 2>/dev/null || true
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"
            cd ${{ secrets.VPS_TARGET_DIR }}
            echo "📂 Direktori aplikasi: $(pwd)"
            git pull origin main
            npm run build
            pm2 restart app-ppmawar || pm2 restart all
            echo "✅ Deployment ke VPS berhasil selesai!"
